<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Inventory Scanner</title>

<script src="https://unpkg.com/@ericblade/quagga2/dist/quagga.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    color: #222;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 14px;
}

/* =========================
   HEADER
========================= */

.header {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 6px 0 0;
    color: #777;
    font-size: 15px;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* =========================
   MODE
========================= */

.mode {
    display: flex;
    gap: 12px;
}

.mode button {
    flex: 1;
    height: 68px;
    border: none;
    border-radius: 16px;
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

/* OUT */

.mode .out-active {
    background: #dc3545;
    color: white;
    box-shadow: 0 5px 12px rgba(220,53,69,.30);
}

/* IN */

.mode .in-active {
    background: #198754;
    color: white;
    box-shadow: 0 5px 12px rgba(25,135,84,.30);
}

/* INACTIVE */

.mode .inactive {
    background: #e9ecef;
    color: #6c757d;
    box-shadow: none;
}

.mode button:active {
    transform: scale(.97);
}

/* =========================
   CAMERA
========================= */

#camera {
    width: 100%;
    height: 270px;
    background: #111;
    border-radius: 16px;
    overflow: hidden;
}

#camera video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.scan-status {
    text-align: center;
    font-size: 15px;
    color: #777;
    margin: 10px 0;
}

/* =========================
   BUTTONS
========================= */

.big-button {
    width: 100%;
    height: 64px;
    border: none;
    border-radius: 15px;
    background: #2563eb;
    color: white;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.big-button:active {
    transform: scale(.98);
}

/* =========================
   INPUT
========================= */

label {
    display: block;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group {
    margin-bottom: 15px;
}

input,
select {
    width: 100%;
    height: 60px;
    border: 2px solid #d9dde3;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 20px;
    background: white;
    outline: none;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

#barcode {
    background: #f1f3f5;
    font-weight: bold;
}

/* =========================
   EXPIRY DATE
========================= */

.expiry-box {
    margin-top: 15px;
    padding: 15px;
    border-radius: 15px;
    background: #fff8dc;
    border: 2px solid #f0c94b;
}

.expiry-box label {
    color: #765d00;
}

#expiry {
    background: #fffdf0;
    border: 2px solid #e5bd25;
    font-weight: bold;
    color: #6b5500;
}

/* =========================
   PRODUCT
========================= */

.product-box {
    margin-top: 15px;
    background: #f5f6f8;
    border-radius: 14px;
    padding: 15px;
}

.product-label {
    color: #777;
    font-size: 14px;
}

.product-name {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================
   MESSAGE
========================= */

.message {
    margin-top: 12px;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    display: none;
}

.message.success {
    display: block;
    background: #d1e7dd;
    color: #0f5132;
}

.message.error {
    display: block;
    background: #f8d7da;
    color: #842029;
}

/* =========================
   SUBMIT
========================= */

.submit {
    width: 100%;
    height: 72px;
    margin-top: 15px;
    border: none;
    border-radius: 16px;
    background: #198754;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}

.submit:active {
    transform: scale(.98);
}

.clear {
    width: 100%;
    height: 55px;
    margin-top: 10px;
    border-radius: 14px;
    border: 2px solid #bbb;
    background: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.clear:active {
    transform: scale(.98);
}

/* =========================
   LOADING
========================= */

.loading {
    opacity: .6;
    pointer-events: none;
}

/* =========================
   HIDDEN
========================= */

.hidden {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px) {

    .container {
        padding: 10px;
    }

    #camera {
        height: 230px;
    }

    input,
    select {
        height: 55px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>📦 Inventory Scanner</h1>

        <p>Stock Movement System</p>

    </div>

    <!-- MODE -->

    <div class="card">

        <div class="title">
            Mode
        </div>

        <div class="mode">

            <button
                id="outBtn"
                class="out-active"
                onclick="selectMode('OUT')">

                OUT

            </button>

            <button
                id="inBtn"
                class="inactive"
                onclick="selectMode('IN')">

                IN

            </button>

        </div>

    </div>

    <!-- SCANNER -->

    <div class="card">

        <div class="title">
            📷 Scan Barcode
        </div>

        <div id="camera"></div>

        <div
            id="scanStatus"
            class="scan-status">

            Press START SCAN to begin

        </div>

        <button
            id="scanButton"
            class="big-button"
            onclick="startScanner()">

            📷 START SCAN

        </button>

    </div>

    <!-- PRODUCT -->

    <div class="card">

        <div class="title">
            Product Information
        </div>

        <!-- BARCODE -->

        <div class="form-group">

            <label>
                Barcode
            </label>

            <input
                id="barcode"
                placeholder="Scan barcode"
                readonly>

        </div>

        <!-- BATCH -->

        <div class="form-group">

            <label>
                Batch Number
            </label>

            <input
                id="batch"
                placeholder="Enter Batch Number">

        </div>

        <!-- CHECK -->

        <button
            id="checkButton"
            class="big-button"
            onclick="checkInventory()">

            🔍 CHECK INVENTORY

        </button>

        <!-- PRODUCT -->

        <div
            id="productBox"
            class="product-box hidden">

            <div class="product-label">
                Product Name
            </div>

            <div
                id="productName"
                class="product-name">

            </div>

        </div>

        <!-- EXPIRY -->

        <div
            id="expiryBox"
            class="expiry-box hidden">

            <label>
                ⭐ RECOMMENDED EXPIRY DATE
            </label>

            <input
                id="expiry"
                type="text"
                placeholder="DD/MM/YYYY"
                readonly>

        </div>

        <!-- MESSAGE -->

        <div
            id="message"
            class="message">

        </div>

    </div>

    <!-- QUANTITY -->

    <div class="card">

        <div class="title">
            Quantity
        </div>

        <div class="form-group">

            <label>
                PIECES
            </label>

            <input
                id="pieces"
                type="number"
                min="0"
                placeholder="Enter pieces">

        </div>

        <div class="form-group">

            <label>
                CTN
            </label>

            <input
                id="cartons"
                type="number"
                min="0"
                placeholder="Enter cartons">

        </div>

        <div class="form-group">

            <label>
                QTY (KG)
            </label>

            <input
                id="qty"
                type="number"
                min="0"
                step="0.01"
                placeholder="Enter quantity">

        </div>

    </div>

    <!-- EMPLOYEE -->

    <div class="card">

        <div class="title">
            Written By
        </div>

        <select id="writer">

            <option value="">
                Select Employee
            </option>

            <option value="Yazhen">
                Yazhen
            </option>

            <option value="JIANGHUA">
                JIANGHUA
            </option>

            <option value="KM">
                KM
            </option>

            <option value="KY">
                KY
            </option>

            <option value="Kyaw">
                Kyaw
            </option>

        </select>

        <button
            id="submitButton"
            class="submit"
            onclick="submitData()">

            ✅ SUBMIT

        </button>

        <button
            class="clear"
            onclick="resetForm()">

            CLEAR / NEW ENTRY

        </button>

    </div>

</div>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwIZPycwnqobCtomUM4o96ver3ghIs-GqRRtfBMthUGws0IG4207coaT3APhsoYpwda/exec";


/* =====================================================
   MODE
===================================================== */

let currentMode = "OUT";


function selectMode(mode) {

    currentMode = mode;

    const outBtn =
        document.getElementById("outBtn");

    const inBtn =
        document.getElementById("inBtn");


    if (mode === "OUT") {

        outBtn.className =
            "out-active";

        inBtn.className =
            "inactive";

        document.getElementById(
            "scanStatus"
        ).innerText =
            "OUT mode selected";

    }


    if (mode === "IN") {

        outBtn.className =
            "inactive";

        inBtn.className =
            "in-active";

        document.getElementById(
            "scanStatus"
        ).innerText =
            "IN function is under development";

    }

}


/* =====================================================
   SCANNER
===================================================== */

let scannerRunning = false;

let scanned = false;


function startScanner() {

    if (currentMode === "IN") {

        alert(
            "IN function is under development."
        );

        return;

    }


    if (scannerRunning) {

        return;

    }


    scanned = false;

    scannerRunning = true;


    document.getElementById(
        "scanStatus"
    ).innerText =
        "📷 Scanning...";


    document.getElementById(
        "scanButton"
    ).innerText =
        "🛑 SCANNING...";


    Quagga.init({

        inputStream: {

            name: "Live",

            type: "LiveStream",

            target:
                document.querySelector(
                    "#camera"
                ),

            constraints: {

                facingMode:
                    "environment",

                width: {

                    ideal: 1280

                },

                height: {

                    ideal: 720

                }

            }

        },

        decoder: {

            readers: [

                "ean_reader",

                "ean_8_reader",

                "code_128_reader"

            ]

        },

        locate: true

    }, function(error) {


        if (error) {

            console.log(error);

            scannerRunning = false;


            document.getElementById(
                "scanStatus"
            ).innerText =
                "❌ Camera error";


            document.getElementById(
                "scanButton"
            ).innerText =
                "📷 START SCAN";


            return;

        }


        Quagga.start();

    });

}


/* =====================================================
   DETECT BARCODE
===================================================== */

Quagga.onDetected(
    function(data) {

        if (!scannerRunning) {

            return;

        }


        if (scanned) {

            return;

        }


        const code =
            data.codeResult.code;


        if (!code) {

            return;

        }


        scanned = true;


        document.getElementById(
            "barcode"
        ).value = code;


        Quagga.stop();


        scannerRunning = false;


        document.getElementById(
            "scanStatus"
        ).innerText =
            "✅ Barcode scanned";


        document.getElementById(
            "scanButton"
        ).innerText =
            "📷 START SCAN";


        document.getElementById(
            "batch"
        ).focus();

    }
);


/* =====================================================
   DATE FORMAT
===================================================== */

/*
   Convert:
   YYYY-MM-DD
   to
   DD/MM/YYYY
*/

function formatExpiryDate(dateString) {

    if (!dateString) {

        return "";

    }


    const parts =
        dateString.split("-");


    if (parts.length !== 3) {

        return dateString;

    }


    const year = parts[0];
    const month = parts[1];
    const day = parts[2];


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


/*
   Convert:
   DD/MM/YYYY
   back to
   YYYY-MM-DD

   This keeps the backend format unchanged.
*/

function convertExpiryForSubmit(dateString) {

    if (!dateString) {

        return "";

    }


    const parts =
        dateString.split("/");


    if (parts.length !== 3) {

        return dateString;

    }


    const day = parts[0];
    const month = parts[1];
    const year = parts[2];


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText = text;

    message.className =
        "message " + type;

}


/* =====================================================
   CHECK INVENTORY
===================================================== */

async function checkInventory() {

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();


    const batch =
        document.getElementById(
            "batch"
        ).value.trim();


    if (!barcode) {

        showMessage(
            "Please scan the barcode first.",
            "error"
        );

        return;

    }


    if (!batch) {

        showMessage(
            "Please enter Batch Number.",
            "error"
        );

        document.getElementById(
            "batch"
        ).focus();

        return;

    }


    const button =
        document.getElementById(
            "checkButton"
        );


    button.innerText =
        "⏳ CHECKING...";

    button.classList.add(
        "loading"
    );


    showMessage(
        "Checking inventory...",
        "success"
    );


    try {

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "checkInventory",

                            barcode:
                                barcode,

                            batch:
                                batch

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            document.getElementById(
                "productBox"
            ).classList.add(
                "hidden"
            );


            document.getElementById(
                "expiryBox"
            ).classList.add(
                "hidden"
            );


            showMessage(
                "❌ " +
                result.message,
                "error"
            );


            return;

        }


        /* PRODUCT */

        document.getElementById(
            "productName"
        ).innerText =
            result.productName ||
            "Product found";


        document.getElementById(
            "productBox"
        ).classList.remove(
            "hidden"
        );


        /* EXPIRY */

        document.getElementById(
            "expiry"
        ).value =
            formatExpiryDate(
                result.expiryDate
            );


        document.getElementById(
            "expiryBox"
        ).classList.remove(
            "hidden"
        );


        showMessage(
            "✅ Inventory found. Earliest expiry date selected.",
            "success"
        );


    } catch (error) {

        console.error(error);


        showMessage(
            "❌ Unable to connect to inventory.",
            "error"
        );

    }


    button.innerText =
        "🔍 CHECK INVENTORY";

    button.classList.remove(
        "loading"
    );

}


/* =====================================================
   SUBMIT
===================================================== */

async function submitData() {

    const barcode =
        document.getElementById(
            "barcode"
        ).value.trim();


    const batch =
        document.getElementById(
            "batch"
        ).value.trim();


    /*
       Display format:
       DD/MM/YYYY

       Backend format:
       YYYY-MM-DD
    */

    const expiryDisplay =
        document.getElementById(
            "expiry"
        ).value.trim();


    const expiry =
        convertExpiryForSubmit(
            expiryDisplay
        );


    const pieces =
        document.getElementById(
            "pieces"
        ).value;


    const cartons =
        document.getElementById(
            "cartons"
        ).value;


    const qty =
        document.getElementById(
            "qty"
        ).value;


    const writer =
        document.getElementById(
            "writer"
        ).value;


    if (!barcode) {

        alert(
            "Please scan the barcode."
        );

        return;

    }


    if (!batch) {

        alert(
            "Please enter Batch Number."
        );

        return;

    }


    if (!expiry) {

        alert(
            "Please CHECK INVENTORY first."
        );

        return;

    }


    if (!pieces &&
        !cartons &&
        !qty) {

        alert(
            "Please enter quantity."
        );

        return;

    }


    if (!writer) {

        alert(
            "Please select Written By."
        );

        return;

    }


    const button =
        document.getElementById(
            "submitButton"
        );


    button.innerText =
        "⏳ SUBMITTING...";

    button.classList.add(
        "loading"
    );


    try {

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "stockOut",

                            barcode:
                                barcode,

                            batch:
                                batch,

                            expiry:
                                expiry,

                            pieces:
                                pieces,

                            cartons:
                                cartons,

                            qty:
                                qty,

                            writer:
                                writer

                        })

                }
            );


        const result =
            await response.json();


        if (!result.success) {

            alert(
                "❌ " +
                result.message
            );

            return;

        }


        alert(
            "✅ Stock OUT submitted successfully!"
        );


        resetForm();


    } catch (error) {

        console.error(error);


        alert(
            "❌ Unable to submit data."
        );

    }


    button.innerText =
        "✅ SUBMIT";

    button.classList.remove(
        "loading"
    );

}


/* =====================================================
   RESET
===================================================== */

function resetForm() {

    document.getElementById(
        "barcode"
    ).value = "";


    document.getElementById(
        "batch"
    ).value = "";


    document.getElementById(
        "expiry"
    ).value = "";


    document.getElementById(
        "pieces"
    ).value = "";


    document.getElementById(
        "cartons"
    ).value = "";


    document.getElementById(
        "qty"
    ).value = "";


    document.getElementById(
        "writer"
    ).value = "";


    document.getElementById(
        "productName"
    ).innerText = "";


    document.getElementById(
        "productBox"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "expiryBox"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "message"
    ).className =
        "message";


    document.getElementById(
        "message"
    ).innerText = "";


    document.getElementById(
        "scanStatus"
    ).innerText =
        "Press START SCAN to begin";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}

</script>

</body>

</html>
